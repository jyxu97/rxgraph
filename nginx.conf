server {
    listen 80;

    # Use Docker's internal DNS so nginx re-resolves upstream service names
    # at request time instead of caching the IP at startup. Without this,
    # recreating the api container gives it a new IP and nginx returns 502
    # until it is manually restarted.
    resolver 127.0.0.11 valid=10s;

    # Serve the React single-page app
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # For any path not matching a static file, return index.html
        # so React Router can handle client-side routing.
        try_files $uri $uri/ /index.html;
    }

    # Proxy all /api/* requests to the FastAPI container.
    # The upstream must be in a variable — nginx only uses the resolver for
    # re-resolution when proxy_pass references a variable, not a literal.
    location /api/ {
        set $upstream http://api:8000;
        proxy_pass         $upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

        # Allow large file uploads (prescription label images)
        client_max_body_size 11M;
    }
}
