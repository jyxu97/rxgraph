server {
    listen 80;

    # Serve the React single-page app
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # For any path not matching a static file, return index.html
        # so React Router can handle client-side routing.
        try_files $uri $uri/ /index.html;
    }

    # Proxy all /api/* requests to the FastAPI container.
    # "api" resolves via Docker Compose's internal DNS to the api service.
    location /api/ {
        proxy_pass         http://api:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

        # Allow large file uploads (prescription label images)
        client_max_body_size 11M;
    }
}
